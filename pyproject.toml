[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "act-gui"
description = "Graphical user interface of the Alexandria Chemistry Toolkit"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
# plotXVG saves the plots as PDF files; 1.3.1 does not import tkinter, which
# needs X11 on Linux
dependencies = ["fastapi", "uvicorn", "plotxvg>=1.3.1"]
dynamic = ["version"]

[project.optional-dependencies]
# To run the tests; selenium only for those that drive a browser
test = ["httpx"]
browser = ["selenium"]

[project.scripts]
act-gui = "act_gui.__main__:main"
# The name of the program that ACT-GUI replaces in ACT-utilities
actgui = "act_gui.__main__:main"

[tool.setuptools]
packages = ["act_gui"]

[tool.setuptools.dynamic]
version = { attr = "act_gui.__version__" }

[tool.setuptools.package-data]
act_gui = ["static/**/*", "data/**/*"]
