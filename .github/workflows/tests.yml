name: ACT-GUI tests
run-name: ${{ github.actor }} tests ACT-GUI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python of the conda package (python_min in
        # conda/recipe.yaml) and a recent one
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        # A login shell, which activates the conda environment
        shell: bash -el {0}
    steps:
      - name: Check out ACT-GUI
        uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          # plotXVG from the channel of ACT, the rest from conda-forge, as
          # for the conda package
          channels: alexandriachemistry,conda-forge
          conda-remove-defaults: "true"
      - name: Install the dependencies
        run: |
          # The run requirements of pyproject.toml and conda/recipe.yaml
          # without the package act of ACT, and httpx for the tests
          conda install "plotxvg>=1.3.1" fastapi uvicorn httpx pip
          # ACT-GUI itself, with the dependencies from conda only
          python -m pip install --no-deps .
          python -m pip check
          conda list
      - name: Run the tests
        run: |
          # The tests of the server, the uploads, the jobs, the plots and
          # the archive for OpenMM. Those that need the alexandria program
          # of ACT or a browser are skipped here: they run where ACT is
          # built, with ACT_ALEXANDRIA set, see README.md.
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee tests.log
          # plotXVG is installed, so the test that makes a real PDF must run
          # (the line after the name of the test says how it ended)
          if grep -A1 "test_real_plotter" tests.log | grep -q "skipped"; then
            echo "::error::The test with plotXVG was skipped"
            exit 1
          fi
