name: Conda package
# Builds the noarch conda package act-gui with the recipe in conda/.
# Pull requests that change the recipe or the package build and test it. A
# tag v* uploads it to the channel alexandriachemistry on anaconda.org with
# the label main, a run by hand with the label that is given, dev by
# default. The upload needs the repository secret ANACONDA_API_TOKEN.
#
# The package needs alexandria-python 1.95b or newer from the channel. As
# long as the channel has none, the package is built without its test,
# with a warning, and is not uploaded.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "conda/**"
      - "act_gui/**"
      - "pyproject.toml"
      - ".github/workflows/conda.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the package to anaconda.org"
        type: boolean
        default: false
      label:
        description: "Label of the uploaded package"
        type: string
        default: "dev"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Inside the workspace, since upload-artifact refuses paths with ..
      CONDA_OUT: ${{ github.workspace }}/conda-out
    steps:
      - uses: actions/checkout@v6
      - name: Check the version
        run: |
          recipe=$(sed -n 's/^  version: "\(.*\)"$/\1/p' conda/recipe.yaml)
          package=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' act_gui/__init__.py)
          echo "recipe ${recipe}, act_gui/__init__.py ${package}"
          if [ -z "${recipe}" ] || [ "${recipe}" != "${package}" ]; then
            echo "::error::The version in conda/recipe.yaml (${recipe}) differs from act_gui/__init__.py (${package})"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${package}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${package}"
            exit 1
          fi
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install rattler-build and anaconda-client
        shell: bash -el {0}
        run: |
          conda install rattler-build anaconda-client
          rattler-build --version
      - name: Is there an alexandria-python for the test?
        id: deps
        shell: bash -el {0}
        run: |
          if conda search --override-channels --channel alexandriachemistry \
                          "alexandria-python>=1.95b" > /dev/null 2>&1; then
            echo "test=yes" >> "${GITHUB_OUTPUT}"
          else
            echo "test=no" >> "${GITHUB_OUTPUT}"
            echo "::warning::The channel alexandriachemistry has no alexandria-python 1.95b or newer: the package is built without its test and is not uploaded"
          fi
      - name: Build and test
        shell: bash -el {0}
        env:
          TEST: ${{ steps.deps.outputs.test == 'yes' && 'native' || 'skip' }}
        run: |
          rattler-build build --recipe conda/recipe.yaml --test ${TEST} \
                              --channel alexandriachemistry --channel conda-forge \
                              --output-dir ${CONDA_OUT}
          ls -l ${CONDA_OUT}/noarch/*.conda
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: conda-noarch
          path: ${{ env.CONDA_OUT }}/noarch/*.conda
      - name: Upload to anaconda.org
        if: steps.deps.outputs.test == 'yes' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload))
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'main' || inputs.label }}
        run: |
          anaconda upload --user alexandriachemistry --label ${LABEL} --skip-existing \
                   ${CONDA_OUT}/noarch/*.conda
